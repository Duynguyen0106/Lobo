<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <defs>
    <linearGradient id="wolfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2d3a"/>
      <stop offset="50%" stop-color="#1a1d28"/>
      <stop offset="100%" stop-color="#0a0b0f"/>
    </linearGradient>
    <linearGradient id="maneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8a838"/>
      <stop offset="100%" stop-color="#d4622a"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c04a"/>
      <stop offset="100%" stop-color="#e8a838"/>
    </radialGradient>
  </defs>
  <!-- Mane -->
  <path d="M200 80c-30 0-55 20-65 50-8 25-5 55 10 75 5-20 15-35 30-45-15-10-20-30-15-50 5-20 20-30 40-30z" fill="url(#maneGrad)" opacity="0.6"/>
  <path d="M200 80c30 0 55 20 65 50 8 25 5 55-10 75-5-20-15-35-30-45 15-10 20-30 15-50-5-20-20-30-40-30z" fill="url(#maneGrad)" opacity="0.6"/>
  <!-- Ears -->
  <path d="M140 100 L120 40 L170 85 Z" fill="#1a1d28" stroke="#e8a838" stroke-width="2"/>
  <path d="M260 100 L280 40 L230 85 Z" fill="#1a1d28" stroke="#e8a838" stroke-width="2"/>
  <!-- Head -->
  <ellipse cx="200" cy="150" rx="70" ry="60" fill="url(#wolfGrad)"/>
  <!-- Snout -->
  <ellipse cx="200" cy="175" rx="35" ry="25" fill="#12141c"/>
  <ellipse cx="200" cy="168" rx="18" ry="12" fill="#0a0b0f"/>
  <!-- Eyes -->
  <ellipse cx="170" cy="140" rx="12" ry="14" fill="url(#eyeGlow)"/>
  <ellipse cx="230" cy="140" rx="12" ry="14" fill="url(#eyeGlow)"/>
  <circle cx="172" cy="138" r="4" fill="#0a0b0f"/>
  <circle cx="232" cy="138" r="4" fill="#0a0b0f"/>
  <!-- Body -->
  <path d="M200 210 C140 220 100 280 90 360 C85 400 110 430 150 440 L250 440 C290 430 315 400 310 360 C300 280 260 220 200 210Z" fill="url(#wolfGrad)"/>
  <!-- Legs -->
  <rect x="120" y="380" width="22" height="80" rx="8" fill="#12141c"/>
  <rect x="160" y="390" width="22" height="70" rx="8" fill="#0a0b0f"/>
  <rect x="218" y="390" width="22" height="70" rx="8" fill="#0a0b0f"/>
  <rect x="258" y="380" width="22" height="80" rx="8" fill="#12141c"/>
  <!-- Tail -->
  <path d="M90 340 Q40 320 30 260 Q25 220 50 200" stroke="#1a1d28" stroke-width="16" stroke-linecap="round" fill="none"/>
  <circle cx="48" cy="198" r="8" fill="#e8e6e3"/>
  <!-- Ground shadow -->
  <ellipse cx="200" cy="470" rx="100" ry="12" fill="#e8a838" opacity="0.08"/>
</svg>
